<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이유식 식단 달력</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이유식 달력">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: graph-paper notebook. Month grid on the left, the chosen day's sheet on the right; every ingredient carries its own highlighter colour, like the handwritten list. Topping stock cards darken from pale to deep red as their use-by date nears. */
:root{
  --paper:#f8fafc; --grid:rgba(66,108,176,.085); --sheet:#ffffff; --sunk:#f1f4f9;
  --ink:#1c2333; --ink-2:#555f73; --ink-3:#8790a3; --rule:#e1e6ee; --rule-2:#cbd3e0;
  --accent:#2d52d0; --accent-ink:#ffffff; --accent-soft:rgba(45,82,208,.10);
  --good:#1f7a48; --good-soft:rgba(31,122,72,.10);
  --warn:#9a5b06; --warn-soft:rgba(214,140,24,.15);
  --bad:#bb3229; --bad-soft:rgba(187,50,41,.10);
  --exp-cool:#fbf3d5; --exp-hot:#a3221a; --exp-ink:#ffffff;
  --hl-green:#c6eda2; --hl-orange:#ffd08f; --hl-yellow:#fff28c; --hl-red:#ffb9b2; --hl-purple:#dccaff;
  --hl-pink:#ffcae3; --hl-white:#e5e9f0; --hl-brown:#e5ccb1; --hl-beige:#f2e6cb;
  --dot-green:#4a9e36; --dot-orange:#ec8a1f; --dot-yellow:#d9b915; --dot-red:#dc4338; --dot-purple:#8550d4;
  --dot-pink:#e3649f; --dot-white:#b3bbc8; --dot-brown:#8a5a33; --dot-beige:#c8ad7c;
  --p-beef:#d6463b; --p-chicken:#c97d0a; --p-tofu:#7c4fd0; --p-fish:#2479bd; --p-other:#687287;
  --font-display:"Gaegu","Nanum Pen Script","Comic Sans MS",cursive;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:12px;
  --shadow:0 1px 0 rgba(28,35,51,.04),0 10px 24px -16px rgba(28,35,51,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141b; --grid:rgba(140,168,224,.055); --sheet:#181c25; --sunk:#1e2330;
    --ink:#e6e9f0; --ink-2:#a6aec0; --ink-3:#747d90; --rule:#272d3a; --rule-2:#353d4f;
    --accent:#91a8ff; --accent-ink:#0e1220; --accent-soft:rgba(145,168,255,.15);
    --good:#74d6a0; --good-soft:rgba(116,214,160,.12); --warn:#f2b65e; --warn-soft:rgba(242,182,94,.13);
    --bad:#ff8c82; --bad-soft:rgba(255,140,130,.12);
    --exp-cool:#262418; --exp-hot:#d63a2e; --exp-ink:#ffffff;
    --hl-green:rgba(132,214,84,.32); --hl-orange:rgba(255,160,60,.34); --hl-yellow:rgba(240,220,60,.30);
    --hl-red:rgba(255,110,100,.32); --hl-purple:rgba(170,130,255,.34); --hl-pink:rgba(255,120,180,.30);
    --hl-white:rgba(200,210,225,.20); --hl-brown:rgba(200,150,100,.30); --hl-beige:rgba(220,195,140,.26);
    --dot-green:#6cc455; --dot-orange:#ffa043; --dot-yellow:#f0d43c; --dot-red:#ff6b5f; --dot-purple:#a67cff;
    --dot-pink:#ff85bd; --dot-white:#c8cfdb; --dot-brown:#c08a5c; --dot-beige:#d9bf8e;
    --p-beef:#ff7a6e; --p-chicken:#f5b347; --p-tofu:#b391ff; --p-fish:#6cb6f0; --p-other:#9aa3b6;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141b; --grid:rgba(140,168,224,.055); --sheet:#181c25; --sunk:#1e2330;
  --ink:#e6e9f0; --ink-2:#a6aec0; --ink-3:#747d90; --rule:#272d3a; --rule-2:#353d4f;
  --accent:#91a8ff; --accent-ink:#0e1220; --accent-soft:rgba(145,168,255,.15);
  --good:#74d6a0; --good-soft:rgba(116,214,160,.12); --warn:#f2b65e; --warn-soft:rgba(242,182,94,.13);
  --bad:#ff8c82; --bad-soft:rgba(255,140,130,.12);
  --exp-cool:#262418; --exp-hot:#d63a2e; --exp-ink:#ffffff;
  --hl-green:rgba(132,214,84,.32); --hl-orange:rgba(255,160,60,.34); --hl-yellow:rgba(240,220,60,.30);
  --hl-red:rgba(255,110,100,.32); --hl-purple:rgba(170,130,255,.34); --hl-pink:rgba(255,120,180,.30);
  --hl-white:rgba(200,210,225,.20); --hl-brown:rgba(200,150,100,.30); --hl-beige:rgba(220,195,140,.26);
  --dot-green:#6cc455; --dot-orange:#ffa043; --dot-yellow:#f0d43c; --dot-red:#ff6b5f; --dot-purple:#a67cff;
  --dot-pink:#ff85bd; --dot-white:#c8cfdb; --dot-brown:#c08a5c; --dot-beige:#d9bf8e;
  --p-beef:#ff7a6e; --p-chicken:#f5b347; --p-tofu:#b391ff; --p-fish:#6cb6f0; --p-other:#9aa3b6;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand{min-width:0;flex:1 1 280px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,4.4vw,44px);line-height:1;letter-spacing:-.5px}
.sub{margin-top:6px;color:var(--ink-2);font-size:14px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--rule);padding:3px;border-radius:999px}
.tabs a{display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--exp-hot);color:var(--exp-ink);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* generic controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--ink-3)}
.card{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);box-shadow:var(--shadow)}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:400;color:var(--ink);min-width:0;width:100%}
textarea{resize:vertical;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.checks label{display:inline-flex;gap:7px;align-items:center}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.hint{font-size:13px;color:var(--ink-2)}

.banner{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:14px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--rule-2)}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}

/* highlighter marks & dots */
mark.hl{background:linear-gradient(transparent 50%,var(--h) 50%,var(--h) 94%,transparent 94%);color:inherit;padding:0 2px;border-radius:2px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--d);flex:none}
.side{color:var(--ink-2);white-space:nowrap}
.ptag{flex:none;font-style:normal;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;
  background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p);line-height:1}

/* chips & picker */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--rule-2);background:var(--sheet);font-size:13px;font-weight:500;line-height:1.3}
.chip .dot{background:var(--d)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--h);border-color:color-mix(in srgb,var(--d) 55%,transparent);font-weight:700}
.chip.late{border-style:dashed;color:var(--ink-3)}
.chip.allergy{text-decoration:line-through;color:var(--bad)}
.chip small{font-size:11px;color:var(--ink-3);font-weight:500}
.chip .cnt{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.chip-m{display:inline-flex;align-items:stretch}
.chip-m .chip{border-top-right-radius:0;border-bottom-right-radius:0}
.chip-x{border:1px solid var(--rule-2);border-left:0;background:var(--sunk);border-radius:0 999px 999px 0;padding:0 9px 0 7px;font-size:14px;line-height:1;color:var(--bad);font-weight:700}
.chip-x:hover{background:var(--bad-soft)}
.cgroup{display:grid;gap:6px}
.cglabel{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.picker{display:grid;gap:10px}
.ptools{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.addrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;padding:10px;border:1px dashed var(--rule-2);border-radius:10px}
.addrow .hint{grid-column:1 / -1}

/* badges & notes */
.bdg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.bdg.good{background:var(--good-soft);color:var(--good)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;line-height:1.45}
.notes li{display:flex;gap:8px;padding:5px 9px;border-radius:7px;align-items:baseline}
.notes li b{flex:none;font-size:11px;letter-spacing:.04em}
.notes .good{background:var(--good-soft);color:var(--good)}
.notes .warn{background:var(--warn-soft);color:var(--warn)}
.notes .bad{background:var(--bad-soft);color:var(--bad)}
.notes .new{background:var(--accent-soft);color:var(--accent)}
.notes li span{color:var(--ink)}

/* expiry colour scale */
.schip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;text-decoration:none;
  background:color-mix(in oklab,var(--exp-hot) var(--u),var(--exp-cool));color:var(--ink);border:1px solid color-mix(in oklab,var(--exp-hot) var(--u),var(--rule-2))}
.schip.hot{color:var(--exp-ink)}

/* calendar layout */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start;margin-top:18px}
.cal-main{display:grid;gap:14px;min-width:0}
.cal-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav h2{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;min-width:6.4em;text-align:center}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule-2);background:var(--sheet);display:grid;place-items:center;font-size:18px;line-height:1}
.icon-btn:hover{border-color:var(--ink-3)}
.month-note{font-size:13px;color:var(--ink-2)}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;background:var(--sheet);box-shadow:var(--shadow)}
.wd{padding:7px 8px;font-size:12px;font-weight:700;color:var(--ink-3);border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule)}
.wd:nth-child(7){border-right:0}
.wd.sun{color:var(--bad)} .wd.sat{color:var(--accent)}
.cell{display:flex;flex-direction:column;gap:5px;min-height:118px;padding:6px 6px 8px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:transparent;text-align:left;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--sunk)}
.cell.out{opacity:.42}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ctop{display:flex;align-items:center;gap:5px;min-height:24px}
.cright{margin-left:auto;display:inline-flex;align-items:center;gap:4px}
.dnum{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1;min-width:24px;height:24px;display:inline-grid;place-items:center;border-radius:999px;font-variant-numeric:tabular-nums}
.cell.sun .dnum{color:var(--bad)}
.cell.today .dnum{background:var(--ink);color:var(--paper)}
.age{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:999px;white-space:nowrap}
.stchg{font-size:10.5px;font-weight:700;color:var(--paper);background:var(--accent);padding:0 6px;border-radius:999px;white-space:nowrap}
.dtot{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--good);white-space:nowrap}
.flag{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.flag.bad{background:var(--bad)} .flag.warn{background:var(--warn)}
.meals{display:grid;gap:5px;min-width:0}
.ml{display:flex;align-items:flex-start;gap:4px;font-size:12px;line-height:1.35;min-width:0}
.mb{display:grid;gap:1px;min-width:0}
.mtxt{color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.mmeta{display:flex;flex-wrap:wrap;gap:0 5px;font-size:10.5px;color:var(--ink-3);line-height:1.35}
.mg{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
.mdots{display:none;flex-wrap:wrap;gap:2px;padding-top:4px}
.mdots .dot{width:7px;height:7px}
.st{font-size:11px;flex:none;margin-left:auto;padding-left:2px}
/* 칸 안 끼니: PC = [태그] 재료 글 ✓ / 폰 = 태그·✓ 한 줄 + 재료 이름 형광펜 세로 목록 */
.mhead{display:contents}
.mhead .ptag{order:1}
.ml > .mb{order:2}
.mhead .st{order:3}
.mnames,.mg-m{display:none}
.mn{display:block;font-size:10.5px;line-height:1.35;padding:0 2px;border-radius:3px;background:var(--h);color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.4px}
/* 목록 보기 */
.cal-list{display:grid;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;background:var(--sheet);box-shadow:var(--shadow)}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:10px 12px;min-width:0;color:var(--ink)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--sunk)}
.lrow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ldate{display:grid;justify-items:center;line-height:1.1;gap:2px}
.ldate b{font-family:var(--font-display);font-size:24px;font-weight:700;min-width:32px;text-align:center;border-radius:999px}
.ldate small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.ldate.sun b,.ldate.sun small{color:var(--bad)}
.ldate.sat small{color:var(--accent)}
.lrow.today .ldate b{background:var(--ink);color:var(--paper)}
.lmeals{display:grid;gap:8px;min-width:0}
.lmeal{display:grid;gap:2px;min-width:0}
.lmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600}
.lmeta .st{margin-left:0;padding-left:0;font-size:12px}
.litems{font-size:14.5px;line-height:1.75;display:flex;flex-wrap:wrap;gap:0 5px;align-items:center}
.lmemo{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ltot{font-size:12.5px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.st.good{color:var(--good)} .st.some{color:var(--warn)} .st.no{color:var(--bad)}
.memo-mark{font-size:10.5px;color:var(--ink-3)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* generator */
.gen{padding:16px;display:grid;gap:12px}
.gen h3,.cform h3,.addform h3,.settings h3,.stkform h3{font-size:16px;font-weight:700}
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* week box */
.week{padding:14px 16px;display:grid;gap:10px}
.week h3{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.week h3 small{font-size:12px;color:var(--ink-3);font-weight:500}

/* day sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet-head h2{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:700}
.sheet-head h2 span{font-size:20px;color:var(--ink-2);margin-left:4px}
.eyebrow{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.06em}
.sheet-tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.stage{background:var(--ink);color:var(--paper)}
.tag.total{background:var(--good-soft);color:var(--good)}
.day-step{display:flex;gap:6px}
.meal-list{display:grid;gap:12px}
.meal{border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--sheet)}
.meal.editing{border-color:var(--accent)}
.meal-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
select.slot{width:auto;font-weight:700;padding:4px 8px;font-size:14px}
.meal-tools{display:flex;flex-wrap:wrap;gap:4px}
.meal-items{font-size:16px;line-height:1.9;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.meal-log{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button.good[aria-pressed="true"]{background:var(--good);color:var(--sheet)}
.seg button.some[aria-pressed="true"]{background:var(--warn);color:var(--sheet)}
.seg button.no[aria-pressed="true"]{background:var(--bad);color:var(--sheet)}
.amt{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600}
.amt input[type=number]{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.amt input[type=time]{width:auto}
.stockline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed var(--rule)}
.memo{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.empty{border:1px dashed var(--rule-2);border-radius:10px;padding:16px;display:grid;gap:10px;color:var(--ink-2);font-size:14px}
.fridge-line{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* editor inside meal */
.editor{border-top:1px dashed var(--rule-2);padding-top:12px;display:grid;gap:12px}
.editor h4{margin:0;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.picks{display:grid;gap:6px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:start;text-align:left;width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px;font-size:14px}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick .pl{line-height:1.8}
.pick .pm{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--ink-2);align-items:center}
.pick-wrap{display:flex;gap:6px;align-items:stretch}
.pick-wrap .pick{flex:1}
details.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:4px 0}
.preview{background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.builder{border:1px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--accent-soft)}

/* combos view */
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.stage-seg{display:flex;flex-wrap:wrap;gap:6px}
.stage-seg button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:10px;padding:6px 12px;display:grid;text-align:left;line-height:1.25;font-weight:700;font-size:15px}
.stage-seg button small{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.stage-seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage-seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.combo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px;align-items:start}
.ccol{padding:14px 16px 10px}
.ccol h3{font-family:var(--font-display);font-size:28px;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1;padding-bottom:10px;border-bottom:1px solid var(--rule-2)}
.ccol h3 .ptag{width:24px;height:24px;font-size:14px;font-family:var(--font-body)}
.ccol h3 small{font-family:var(--font-body);font-size:13px;color:var(--ink-3);font-weight:500;margin-left:auto}
.clist{list-style:none;margin:0;padding:0}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:0}
.tick{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--rule-2);background:transparent;color:transparent;font-weight:800;font-size:14px;display:grid;place-items:center;margin-top:3px}
.tick[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.cline{font-size:15.5px;line-height:1.85;display:flex;flex-wrap:wrap;gap:0 5px;align-items:center}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--ink-3);align-items:center}
.cact{display:flex;gap:2px}
.confirm{grid-column:2 / -1;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--bad);flex-wrap:wrap}
.cform,.addform,.sug,.stkform{padding:16px;display:grid;gap:12px;margin-top:14px}
.sug-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.sug-item{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--sheet)}
.sug-item.added{opacity:.55}
.empty-big{margin-top:16px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--ink-2)}
.empty-big h3{font-family:var(--font-display);font-size:28px;color:var(--ink)}

/* topping stock view */
.stk-sum{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end;margin-top:18px}
.stk-num{display:grid;line-height:1.15}
.stk-num b{font-family:var(--font-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.stk-num span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.stk-num.alert b{color:var(--bad)}
.ramp{display:grid;gap:4px;margin-left:auto;font-size:12px;color:var(--ink-2);min-width:0}
.ramp-bar{display:flex;gap:2px}
.ramp-bar i{display:block;width:16px;height:14px;border-radius:3px;background:color-mix(in oklab,var(--exp-hot) var(--u),var(--exp-cool));border:1px solid color-mix(in oklab,var(--exp-hot) var(--u),var(--rule-2))}
.ramp-lab{display:flex;justify-content:space-between}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
.stk{background:color-mix(in oklab,var(--exp-hot) var(--u),var(--exp-cool));border:1px solid color-mix(in oklab,var(--exp-hot) var(--u),var(--rule-2));border-radius:12px;padding:12px 14px;display:grid;gap:7px;align-content:start;color:var(--ink)}
.stk.hot{color:var(--exp-ink)}
.stk.expired{outline:2px dashed var(--exp-hot);outline-offset:3px}
.stk-top{display:flex;align-items:center;gap:8px}
.stk-name{font-size:17px}
.stk-d{margin-left:auto;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;white-space:nowrap}
.stk-qty{display:flex;align-items:center;gap:10px}
.stk-qty span{font-size:14px;font-weight:600}
.stk-qty b{font-size:24px;font-variant-numeric:tabular-nums}
.qbtn{width:34px;height:34px;border-radius:8px;border:1px solid color-mix(in srgb,currentColor 45%,transparent);background:transparent;font-size:20px;line-height:1;color:inherit}
.qbtn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.stk-line{font-size:12.5px;opacity:.85}
.stk-warn{font-size:12.5px;font-weight:700}
.stk .btn{background:transparent;border-color:color-mix(in srgb,currentColor 35%,transparent);color:inherit}
.stk-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border-radius:10px;background:var(--sheet);color:var(--ink)}
.stk-edit .full{grid-column:1 / -1}
.done-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.done-list li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-size:13.5px}
.done-list li .row{margin-left:auto}

/* ingredients view */
.ing-groups{display:grid;gap:22px;margin-top:16px}
.ing-groups h3{font-family:var(--font-display);font-size:26px;font-weight:700;margin-bottom:8px}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ing{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.ing.locked{background:transparent;border-style:dashed}
.ing.locked .ing-top b{color:var(--ink-3)}
.ing.allergic{border-color:var(--bad)}
.ing-top{display:flex;align-items:center;gap:7px}
.ing-top b{font-size:15px}
.ing-top .mo{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ing-note{font-size:12px;color:var(--ink-2);line-height:1.45}
.ing-flags{display:flex;flex-wrap:wrap;gap:4px}
.ing-flags:empty{display:none}
.ing-acts{display:flex;gap:4px;flex-wrap:wrap}
.tog{border:1px solid var(--rule-2);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tog[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tog.bad[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.pairs-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:12px}
.pairs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pairs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule)}
.pairs .pp{font-size:15px;line-height:1.7}
.pairs .pr{grid-column:1;font-size:12.5px;color:var(--ink-2)}
.pcol{padding:14px 16px;display:grid;gap:10px;align-content:start}
.pcol h3{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.section-title{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:34px;line-height:1}
.section-sub{font-size:13.5px;color:var(--ink-2);margin-top:6px;max-width:68ch}

/* guide */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.gcard{padding:16px;display:grid;gap:12px;align-content:start}
.gcard.cur{outline:2px solid var(--accent);outline-offset:-1px}
.gcard h3{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gcard h3 small{font-family:var(--font-body);font-size:13px;color:var(--ink-2);font-weight:600}
.gdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:13.5px}
.gdl dt{color:var(--ink-3);font-weight:600}
.gdl dd{margin:0}
.gcard ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px;color:var(--ink-2)}
.rules{padding:16px 18px;margin-top:16px;display:grid;gap:10px}
.rules ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;max-width:80ch}

/* settings */
.settings{padding:16px;margin-top:14px;display:grid;gap:12px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
.toast .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 40%,transparent)}

@media (min-width:1101px){
  .sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}
}
@media (max-width:1100px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .cell{min-height:74px;padding:4px 3px 6px}
  .ctop{flex-wrap:wrap;gap:2px}
  .dnum{font-size:17px;min-width:21px;height:21px}
  .mtxt,.memo-mark,.age,.mmeta,.dtot{display:none}
  .ml{display:grid;gap:2px}
  .mhead{display:flex;align-items:center;gap:3px;min-width:0}
  .mhead .st{margin-left:auto;padding-left:0}
  .mnames{display:grid;gap:1px}
  .mg-m{display:block;font-size:10px;letter-spacing:-.3px;padding-left:1px}
  .meals{gap:6px}
  .dtot{font-size:10px}
  .ptag{width:15px;height:15px;font-size:10px;border-radius:4px}
  .stchg{font-size:9.5px;padding:0 4px}
  .month-nav h2{font-size:27px;min-width:0}
  .sheet{padding:14px}
  .crow{grid-template-columns:28px minmax(0,1fr)}
  .cact{grid-column:2}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow input{grid-column:1 / -1}
  .ramp{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .cell,.chip,.pick,.btn,.qbtn{transition:background-color .12s ease,border-color .12s ease}
}

/* standalone page base (GitHub Pages) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--qr-bg:#ffffff}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
input[type=password]{border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);min-width:0;width:100%}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.ok i{background:var(--good)}
.sync.busy i{background:var(--warn)}
.sync.bad{color:var(--bad);border-color:var(--bad)}
.sync.bad i{background:var(--bad)}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px 28px}
.sbox{display:grid;gap:10px;align-content:start;min-width:0}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}
.steps a{color:var(--accent);font-weight:600}
.qr-box{display:grid;gap:8px;justify-items:start}
.qr{background:var(--qr-bg);padding:10px;border-radius:12px;width:min(240px,100%);border:1px solid var(--rule-2)}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
@media (max-width:700px){
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{font-size:16px}
  .top-actions{width:100%;justify-content:space-between}
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="appTitle">이유식 식단 달력</h1>
      <p class="sub" id="ageLine">중기 7~8개월 식단</p>
    </div>
    <nav class="tabs" aria-label="화면">
      <a href="#calendar" data-tab="calendar">달력</a>
      <a href="#combos" data-tab="combos">조합</a>
      <a href="#stock" data-tab="stock">토핑 재고<span class="tbadge" id="stockBadge" hidden></span></a>
      <a href="#ingredients" data-tab="ingredients">재료·궁합</a>
      <a href="#guide" data-tab="guide">시기별 가이드</a>
    </nav>
    <div class="top-actions">
      <button type="button" class="sync" id="syncPill" data-act="settings" aria-label="동기화 상태, 누르면 설정"><i></i>준비 중</button>
      <button type="button" class="btn" data-act="settings">설정</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="settingsBox"></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const md = k => { const d = parseKey(k); return `${d.getMonth()+1}/${d.getDate()}`; };

function refreshIng(){

  for (const [id,name,cat,mo,color,note,al] of ING) m.set(id, {id, name, cat, m:mo, color, note:note||'', al:!!al, custom:false, tried:false, allergy:false, hidden:false});

const stageById = id => STAGES.find(s => s.id === id) || STAGES[1];
const stageIdx = id => Math.max(0, STAGES.findIndex(s => s.id === id));
const stageForMonths = m => m <= 6 ? 'early' : m <= 8 ? 'mid' : m <= 11 ? 'late' : 'done';
function ageOn(d){
  const b = S.settings.birthDate; if (!isDateKey(b)) return null;
  const bd = parseKey(b);
  let m = (d.getFullYear()-bd.getFullYear())*12 + (d.getMonth()-bd.getMonth());
  let day = d.getDate() - bd.getDate();
  if (day < 0){ m--; day += new Date(d.getFullYear(), d.getMonth(), 0).getDate(); }
  return m < 0 ? null : {m, d:day};
}
function stageOf(k){ const a = ageOn(parseKey(k)); return a ? stageForMonths(a.m) : (STAGES.some(s=>s.id===S.settings.stage) ? S.settings.stage : 'mid'); }
const curStage = () => stageOf(TODAY);

const nm = id => IM.get(id)?.name || (id ? '(지운 재료)' : '');

const dot = id => `<i class="dot" style="--d:var(--dot-${colorOf(id)})" title="${esc(nm(id))}"></i>`;

function normMeal(m){ m = m || {}; return {slot:SLOT_CHOICES.includes(m.slot)?m.slot:'오전', time:isTime(m.time)?m.time:'', protein:typeof m.protein==='string'?m.protein:'', items:arr(m.items), side:arr(m.side), comboId:typeof m.comboId==='string'?m.comboId:'', status:STATUS.some(s=>s[0]===m.status)?m.status:'plan', amount:typeof m.amount==='number'?m.amount:null, note:typeof m.note==='string'?m.note:'', stockUsed:arr(m.stockUsed)}; }
function normDay(d){ d = d || {}; return {meals:(Array.isArray(d.meals)?d.meals:[]).map(normMeal), memo:typeof d.memo==='string'?d.memo:''}; }
function normCombo(id, d){ d = d || {}; return {id, stage:STAGES.some(s=>s.id===d.stage)?d.stage:'mid', protein:typeof d.protein==='string'?d.protein:'', items:arr(d.items), side:arr(d.side), fav:!!d.fav, memo:typeof d.memo==='string'?d.memo:'', order:typeof d.order==='number'?d.order:9999, created:typeof d.created==='number'?d.created:0}; }
function normStock(id, d){ d = d || {}; const made = isDateKey(d.made) ? d.made : TODAY; return {id, ing:typeof d.ing==='string'?d.ing:'', made, expires:isDateKey(d.expires)?d.expires:keyOf(addDays(parseKey(made), SHELF)), qty:typeof d.qty==='number'?d.qty:0, unit:UNITS.includes(d.unit)?d.unit:'큐브', memo:typeof d.memo==='string'?d.memo:'', created:typeof d.created==='number'?d.created:0}; }
const byOrder = (a,b) => (a.order-b.order) || (a.created-b.created) || a.id.localeCompare(b.id);
const combosOf = st => [...S.combos.values()].filter(c => c.stage === st).sort(byOrder);

/* stock helpers */
function urg(expires){ const d = daysBetween(TODAY, expires); const p = d < 0 ? 1 : Math.min(1, Math.max(0.05, 1 - d / SHELF)); return {d, p, hot:p >= 0.6}; }
const dLabel = d => d > 0 ? `D-${d}` : d === 0 ? '오늘까지' : `${-d}일 지남`;
const activeStock = () => [...S.stock.values()].filter(s => s.qty > 0 && s.ing).sort((a,b) => a.expires.localeCompare(b.expires) || a.created - b.created);
// 기한이 지나지 않은 재고만 (추천·차감·식단 계산용)
function stockByIng(){ const m = new Map(); for (const s of activeStock()){ if (s.expires < TODAY) continue; if (!m.has(s.ing)) m.set(s.ing, []); m.get(s.ing).push(s); } return m; }
function schip(id, rows){
  const tot = rows.reduce((a, s) => a + s.qty, 0); const u = urg(rows[0].expires);
  return `<span class="schip${u.hot ? ' hot' : ''}" style="--u:${Math.round(u.p*100)}%" title="${esc(nm(id))} 기한 ${md(rows[0].expires)}"><i class="dot" style="--d:var(--dot-${colorOf(id)})"></i>${esc(nm(id))} ${tot}${esc(rows[0].unit)} · ${dLabel(u.d)}</span>`;
}
function plannedUses(){
  const res = new Map();
  for (const [ing, rows] of stockByIng()){
    const dates = [];
    for (const [k, day] of S.plan){ if (k < TODAY) continue; for (const m of day.meals) if (m.status !== 'no' && !m.stockUsed.length && mealIds(m).includes(ing)) dates.push(k); }
    dates.sort();
    let idx = 0;
    for (const r of rows){ let n = 0; while (idx < dates.length && dates[idx] <= r.expires && n < r.qty){ n++; idx++; } res.set(r.id, n); }
  }
  return res;
}
const urgentCount = () => activeStock().filter(s => urg(s.expires).d <= 3).length;

function pairList(){
  const base = PAIRS.map(([a,b,kind,reason], i) => ({id:'base'+i, a, b, kind, reason, base:true}));
  const user = [...S.pairUser.values()].filter(p => p.a && p.b && (p.kind==='good'||p.kind==='bad'));
  return base.concat(user);
}
function pairsFor(ids){ const set = new Set(ids); return pairList().filter(p => set.has(p.a) && set.has(p.b) && p.a !== p.b); }

function analyze(protein, items, side, stId){
  const ids = [...new Set([protein, ...(items||[]), ...(side||[])].filter(Boolean))];
  const st = stageById(stId);
  const r = {good:[], bad:[], late:[], allergy:[], fresh:[]};
  for (const p of pairsFor(ids)) (p.kind === 'good' ? r.good : r.bad).push(p);
  let tracking = false; for (const g of IM.values()) if (g.tried){ tracking = true; break; }
  for (const id of ids){
    const g = IM.get(id); if (!g) continue;
    if (g.m > st.max) r.late.push(g);
    if (g.allergy) r.allergy.push(g);
    else if (tracking && !g.tried && id !== 'rice') r.fresh.push(g);
  }
  return r;
}
function notesHTML(r){
  const L = [];
  for (const g of r.allergy) L.push(`<li class="bad"><b>반응</b><span>${esc(g.name)} · 전에 반응이 있었던 재료예요</span></li>`);
  for (const g of r.late) L.push(`<li class="bad"><b>시기</b><span>${esc(g.name)} · ${g.m}개월부터 권장</span></li>`);
  for (const p of r.bad) L.push(`<li class="warn"><b>주의</b><span>${esc(nm(p.a))}+${esc(nm(p.b))} · ${esc(p.reason)}</span></li>`);
  for (const p of r.good) L.push(`<li class="good"><b>궁합</b><span>${esc(nm(p.a))}+${esc(nm(p.b))} · ${esc(p.reason)}</span></li>`);
  if (r.fresh.length) L.push(`<li class="new"><b>처음</b><span>${r.fresh.map(g=>esc(g.name)).join(', ')} · 새 재료는 하루에 하나씩</span></li>`);
  return L.length ? `<ul class="notes">${L.join('')}</ul>` : '';
}
function badges(r){
  const b = [];
  if (r.allergy.length || r.late.length) b.push(`<span class="bdg bad">확인 ${r.allergy.length + r.late.length}</span>`);
  if (r.bad.length) b.push(`<span class="bdg warn">주의 ${r.bad.length}</span>`);
  if (r.good.length) b.push(`<span class="bdg good">궁합 ${r.good.length}</span>`);
  return b.join('');
}
function comboLine(c, withProt){
  const parts = [];
  if (withProt && c.protein) parts.push(hl(c.protein));
  for (const id of c.items) parts.push(hl(id));
  if (c.side && c.side.length) parts.push(`<span class="side">+ ${c.side.map(hl).join(' ')}</span>`);
  return parts.join(' ') || '<span class="muted">재료 없음</span>';
}
function scoreCombo(p, items){
  let s = 0;
  for (const x of pairsFor([p, ...items])) s += x.kind === 'good' ? 3 : -8;
  s += new Set(items.map(colorOf)).size;
  s += items.length * 1.5;

function b64enc(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }

const ghHeaders = extra => Object.assign({Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'}, extra || {});
function failState(r){
  if (r.status === 401) return 'auth';
  if (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0') return 'error';
  if (r.status === 403 || r.status === 404) return 'notfound';
  return 'error';
}
function setSync(state){ SYNC.state = state; renderSync(); renderBanner(); }

async function pull(force, inSave){
  if (!token){ setSync('nolink'); return false; }
  if (SYNC.state === 'idle' || SYNC.state === 'nolink') setSync('loading');
  let r;
  try { r = await fetch(apiUrl() + '?ref=' + GH.branch, {headers:ghHeaders(etag && !force ? {'If-None-Match':etag} : null), cache:'no-store'}); }
  catch (e){ setSync('offline'); return false; }
  if (r.status === 304){ if (!hasPending() && !saving) setSync('saved'); return true; }
  if (!r.ok){ setSync(failState(r)); return false; }
  let j, text = '';
  try {
    j = await r.json();
    text = j.content ? b64dec(j.content) : '';
    if (!text && j.size > 0){
      const r2 = await fetch(apiUrl() + '?ref=' + GH.branch, {headers:ghHeaders({Accept:'application/vnd.github.raw'}), cache:'no-store'});
      text = await r2.text();
    }
  } catch (e){ setSync('offline'); return false; }
  let remote;
  try { remote = JSON.parse(text || '{}'); } catch (e){ setSync('error'); return false; }
  sha = j.sha; etag = r.headers.get('ETag'); LS.set('sha', sha);
  DOC = normDoc(remote);
  for (const [p, b] of Object.entries(PENDING)) applyPatch(DOC, p, b);
  docToState(); persistLocal();
  if (!inSave){ if (hasPending()) scheduleSave(300); else setSync('saved'); }
  scheduleRender();
  return true;
}
function scheduleSave(ms){
  clearTimeout(saveTimer);
  if (!token){ setSync('nolink'); return; }
  if (!saving) setSync('pending');
  saveTimer = setTimeout(save, ms ?? 1200);
}
async function save(){
  clearTimeout(saveTimer);
  if (!token){ setSync('nolink'); return; }
  if (!hasPending()) return;
  if (saving){ saveAgain = true; return; }
  saving = true; saveAgain = false; setSync('saving');
  let done = false;
  try {
    for (let attempt = 0; attempt < 4 && !done; attempt++){
      const batch = {...PENDING};
      const json = JSON.stringify({...DOC, updated:new Date().toISOString()}, null, 1);
      const body = {message:'이유식 기록 ' + new Date().toLocaleString('ko-KR'), content:b64enc(json), branch:GH.branch};
      if (sha) body.sha = sha;
      const payload = JSON.stringify(body);
      let r;
      try { r = await fetch(apiUrl(), {method:'PUT', headers:ghHeaders({'Content-Type':'application/json'}), body:payload, keepalive:payload.length < 60000 && document.visibilityState === 'hidden'}); }
      catch (e){ setSync('offline'); clearTimeout(retryTimer); retryTimer = setTimeout(save, 20000); return; }
      if (r.ok){
        let j = null; try { j = await r.json(); } catch (e){}
        if (j && j.content && j.content.sha) sha = j.content.sha;
        etag = null; LS.set('sha', sha || '');
        for (const p of Object.keys(batch)) if (PENDING[p] === batch[p]) delete PENDING[p];
        savePendingLocal();
        SYNC.last = Date.now(); LS.set('last', String(SYNC.last));
        done = true;
      } else if (r.status === 409 || r.status === 422){
        // 다른 기기가 먼저 저장함 → 최신본을 받아 내 변경을 다시 얹고 재시도
        if (!(await pull(true, true))) return;
      } else { setSync(failState(r)); return; }
    }
    if (!done){ setSync('error'); return; }
    setSync(hasPending() ? 'pending' : 'saved');
  } finally {
    saving = false;
    if (hasPending() && (saveAgain || done)) scheduleSave(500);
  }
}

function boot(){
  let linked = false;

  if (m){
    try { token = decodeURIComponent(m[1]).trim(); } catch (e){ token = m[1].trim(); }
    LS.set('token', token); linked = true; etag = null;

  document.addEventListener('visibilitychange', () => {
    if (!token) return;

/* ───────────── generator ───────────── */
function poolFor(stId, o){
  let pool = combosOf(stId);
  if (pool.length < 3) pool = combosUpTo(stId);
  pool = pool.filter(c => ![c.protein, ...c.items, ...c.side].some(id => IM.get(id)?.allergy));
  if (o && o.fav){ const f = pool.filter(c => c.fav); if (f.length) pool = f; }
  return pool.slice().sort((a,b) => (b.fav - a.fav) || byOrder(a,b));
}
function makePicker(stId, o){
  const pool = poolFor(stId, o);
  if (!pool.length) return null;
  const SB = o.stock ? stockByIng() : null;
  const stockScore = (c, k) => {
    if (!SB || !SB.size) return 0;
    let s = 0;
    for (const id of new Set([c.protein, ...c.items, ...c.side])){
      const rows = SB.get(id); if (!rows) continue;
      const r = rows.find(x => x.expires >= k); if (!r) continue;
      s += 1.5 + Math.max(0, (SHELF - daysBetween(k, r.expires)) / SHELF);
    }
    return s;
  };
  const mk = list => ({list, used:new Set()});
  const q = {beef:mk(pool.filter(c => c.protein === 'beef')), other:mk(pool.filter(c => c.protein !== 'beef')), all:mk(pool)};
  const from = (qq, prev, avoid, k) => {
    if (!qq.list.length) return null;
    let c = qq.list.filter(x => !qq.used.has(x.id) && !avoid.has(x.id));
    if (!c.length){ qq.used.clear(); c = qq.list.filter(x => !avoid.has(x.id)); }
    if (!c.length) return null;
    let best = c[0], bs = -1;
    if ((o.chain && prev.size) || (SB && SB.size)){
      for (const x of c){
        const s = (o.chain ? x.items.filter(i => prev.has(i)).length : 0) + stockScore(x, k);
        if (s > bs){ bs = s; best = x; }
      }
    }
    qq.used.add(best.id); return best;
  };
  return {
    pick(want, prev, avoid, k){
      if (want === 'beef') return from(q.beef, prev, avoid, k) || from(q.all, prev, avoid, k);
      if (want === 'other') return from(q.other, prev, avoid, k) || from(q.beef, prev, avoid, k) || from(q.all, prev, avoid, k);
      return from(q.all, prev, avoid, k);
    }
  };
}
function genDays(o){
  const start = parseKey(o.start);
  if (o.days === 'month') return new Date(start.getFullYear(), start.getMonth()+1, 0).getDate() - start.getDate() + 1;
  return Math.max(1, Math.min(120, Number(o.days) || 28));
}
const itemsOfMeals = meals => new Set(meals.flatMap(m => [...m.items]));
function runGenerate(){
  const o = S.ui.gen;
  if (!isDateKey(o.start)){ toast('시작일을 골라주세요'); return; }
  const n = genDays(o), start = parseKey(o.start);
  const dates = Array.from({length:n}, (_, i) => keyOf(addDays(start, i)));
  const pickers = {}; let prev = new Set(); let cur = null; let streak = 0; let made = 0; const missing = new Set();
  for (const k of dates){
    const existing = S.plan.get(k);
    if (!o.over && existing && existing.meals.length){ prev = itemsOfMeals(existing.meals); cur = null; continue; }
    const stId = o.stage === 'auto' ? stageOf(k) : o.stage;
    const st = stageById(stId);
    const nMeals = Number(o.meals) || st.meals;
    if (!cur || streak >= Number(o.repeat) || cur.stage !== stId || cur.meals.length !== nMeals){
      const pk = pickers[stId] || (pickers[stId] = makePicker(stId, o));
      if (!pk){ missing.add(st.name); cur = null; continue; }
      const slots = SLOTS[Math.min(nMeals, 4)] || SLOTS[2];
      const meals = []; const used = new Set();
      for (let i = 0; i < nMeals; i++){
        const want = o.beef ? (i % 2 === 0 ? 'beef' : 'other') : 'any';
        const c = pk.pick(want, prev, used, k); if (!c) continue;
        used.add(c.id);
        meals.push(normMeal({slot:slots[i] || '간식', protein:c.protein, items:c.items, side:c.side, comboId:c.id}));
      }
      cur = {stage:stId, meals}; streak = 0;
    }
    streak++;
    const day = {meals:cur.meals.map(m => normMeal(clone(m))), memo:existing ? existing.memo : ''};
    setDay(k, day); made++;
    prev = itemsOfMeals(day.meals);
  }
  if (made){ S.ui.gen.open = false; toast(`${made}일 식단을 짰어요` + (missing.size ? ` · ${[...missing].join(', ')} 조합이 없어 비운 날이 있어요` : '')); }
  else if (missing.size) toast(`${[...missing].join(', ')} 조합이 없어요. 조합 탭에서 먼저 만들어 주세요`);
  else toast('빈 날이 없어요. ‘이미 짜둔 날도 다시 짜기’를 켜면 새로 짜요');
}

/* ───────────── suggestions ───────────── */
function availableIds(stId){
  // 냉장고에 남은 재료 + 토핑 재고 (재고가 있는 재료)
  const st = stageById(stId);
  const SB = stockByIng();
  const ok = id => { const g = IM.get(id); return g && g.m <= st.max && !g.allergy; };
  const ids = [...new Set([...SB.keys(), ...S.fridge])].filter(id => id !== 'rice' && ok(id));
  return {ids, SB};
}
function fridgeIdeas(stId){
  const {ids, SB} = availableIds(stId);
  const F = new Set(ids);
  const urgBonus = id => { const rows = SB.get(id); if (!rows) return 0; return 1 + Math.max(0, (SHELF - urg(rows[0].expires).d) / SHELF) * 2; };
  const existing = combosUpTo(stId).map(c => {
    const all = [c.protein, ...c.items, ...c.side].filter(x => x && x !== 'rice');
    const have = all.filter(x => F.has(x));
    return {c, have, need:all.filter(x => !F.has(x)), u:have.reduce((a, x) => a + urgBonus(x), 0)};
  }).filter(x => x.have.length).sort((a,b) => (a.need.length - b.need.length) || (b.u - a.u) || (b.have.length - a.have.length)).slice(0, 6);
  let prots = ids.filter(id => IM.get(id).cat === 'prot');
  const protMissing = !prots.length;
  if (protMissing) prots = ['beef','chicken'].filter(id => { const g = IM.get(id); return g && g.m <= stageById(stId).max && !g.allergy; });
  const vegs = ids.filter(id => ['veg','mush','grain'].includes(IM.get(id).cat)).sort((a,b) => urgBonus(b) - urgBonus(a)).slice(0, 12);
  const sizes = vegs.length >= 3 ? [3,2] : vegs.length === 2 ? [2,1] : vegs.length === 1 ? [1] : [];
  const have = new Set(combosUpTo(stId).map(ckey));
  const cands = [];
  for (const p of prots) for (const size of sizes) for (const items of subsets(vegs, size)){
    if (pairsFor([p, ...items]).some(x => x.kind === 'bad')) continue;
    const s = scoreCombo(p, items) + [p, ...items].reduce((a, x) => a + urgBonus(x), 0) * 1.5;
    cands.push({protein:p, items, score:s, known:have.has(ckey({protein:p, items}))});
  }
  cands.sort((a,b) => b.score - a.score);
  const ideas = []; const perP = {}; const vegUse = {}; const capP = prots.length > 1 ? 3 : 6;
  for (const c of cands){
    if (ideas.length >= 6) break;
    if ((perP[c.protein]||0) >= capP) continue;
    if (c.items.some(i => (vegUse[i]||0) >= 3)) continue;
    ideas.push(c); perP[c.protein] = (perP[c.protein]||0) + 1; c.items.forEach(i => vegUse[i] = (vegUse[i]||0) + 1);
  }
  return {existing, ideas, protMissing, count:F.size, ids, SB};
}
function stageIdeas(stId, seed){
  const st = stageById(stId); const prevSt = STAGES[stageIdx(stId)-1];
  const ok = g => g.m <= st.max && !g.allergy && !g.hidden;
  const prots = [...IM.values()].filter(g => g.cat === 'prot' && ok(g)).map(g => g.id);
  const vegs = [...IM.values()].filter(g => (g.cat === 'veg' || g.cat === 'mush') && ok(g)).map(g => g.id);
  const isNew = id => !!prevSt && IM.get(id).m > prevSt.max;
  const r = rng(seed * 7919 + stageIdx(stId) * 31 + 1);
  const have = new Set([...S.combos.values()].filter(c => c.stage === stId).map(ckey));
  const cands = new Map();
  for (const p of prots) for (let t = 0; t < 70; t++){
    const pool = vegs.slice(); const items = [];
    const size = r() < 0.75 ? 3 : 2;
    while (items.length < size && pool.length){ items.push(pool.splice(Math.floor(r()*pool.length), 1)[0]); }
    const k = ckey({protein:p, items});
    if (have.has(k) || cands.has(k)) continue;
    if (pairsFor([p, ...items]).some(x => x.kind === 'bad')) continue;
    const s = scoreCombo(p, items) + items.filter(isNew).length * 1.5 + (isNew(p) ? 2 : 0) + r() * 2.5;
    cands.set(k, {protein:p, items, score:s});
  }
  const sorted = [...cands.values()].sort((a,b) => b.score - a.score);
  const out = []; const perP = {}; const vegUse = {};
  for (const c of sorted){
    if (out.length >= 9) break;
    if ((perP[c.protein]||0) >= 2) continue;
    if (c.items.some(i => (vegUse[i]||0) >= 2)) continue;
    out.push(c); perP[c.protein] = (perP[c.protein]||0) + 1; c.items.forEach(i => vegUse[i] = (vegUse[i]||0) + 1);
  }
  return out;
}

function weekHTML(){
  const sel = parseKey(S.sel); const ws = addDays(sel, -sel.getDay()); const we = addDays(ws, 6);
  const count = new Map(); let meals = 0, grams = 0;
  for (let i = 0; i < 7; i++){
    const day = S.plan.get(keyOf(addDays(ws, i)));
    for (const m of day ? day.meals : []){ meals++; if (m.amount != null) grams += m.amount; for (const id of [m.protein, ...m.items, ...m.side]) if (id && id !== 'rice') count.set(id, (count.get(id)||0) + 1); }
  }
  const catOrder = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
  const SB = stockByIng();
  const list = [...count.entries()].sort((a,b) => ((catOrder[IM.get(a[0])?.cat] ?? 9) - (catOrder[IM.get(b[0])?.cat] ?? 9)) || b[1] - a[1]);
  return `<section class="card week" aria-label="이번 주 재료">
    <h3>${ws.getMonth()+1}/${ws.getDate()}~${we.getMonth()+1}/${we.getDate()} 재료 <small>장보기·토핑 준비용 · 숫자는 들어가는 끼니 수 · ${meals}끼${grams ? ` · 먹은 양 ${grams}g` : ''}</small></h3>
    ${list.length ? `<div class="chips">${list.map(([id, n]) => { const s = SB.get(id); const have = s ? s.reduce((a, r) => a + r.qty, 0) : 0; return `<span class="chip" style="--h:var(--hl-${colorOf(id)});--d:var(--dot-${colorOf(id)})"><i class="dot"></i>${esc(nm(id))} <span class="cnt">×${n}</span>${have ? `<small>재고 ${have}</small>` : ''}</span>`; }).join('')}</div>` : '<p class="hint">이 주에는 아직 식단이 없어요.</p>'}
  </section>`;
}
function sheetHTML(){

    <p class="fridge-line"><b>남은 재료</b>${fr.length ? fr.map(hl).join(' ') : '<span class="muted">없음</span>'}${SB.size ? ` <a class="btn sm quiet" href="#stock">토핑 재고 ${SB.size}가지</a>` : ''}</p>
    <label class="memo" for="memo-${k}"><span>메모 · 반응 기록</span><textarea id="memo-${k}" data-field="memo" data-k="${k}" rows="3" placeholder="예: 볼 발진 없음, 변 상태 좋음">${esc(day.memo)}</textarea></label>

}
function mealHTML(k, m, i, st, SB){
  const r = analyze(m.protein, m.items, m.side, st.id);
  const ed = S.ui.editor && S.ui.editor.k === k && S.ui.editor.i === i ? S.ui.editor : null;
  const items = [m.protein, ...m.items].filter(Boolean).map(hl).join(' ');
  const side = m.side.length ? `<span class="side">+ ${m.side.map(hl).join(' ')}</span>` : '';
  const tool = (mode, label) => `<button type="button" class="btn sm${ed && ed.mode === mode ? ' on' : ''}" data-act="ed" data-k="${k}" data-i="${i}" data-mode="${mode}" aria-expanded="${!!(ed && ed.mode === mode)}">${label}</button>`;
  const inStock = mealIds(m).filter(id => SB.has(id));
  const stockLine = (inStock.length || m.stockUsed.length) ? `<div class="stockline"><span class="cglabel">토핑 재고</span>${inStock.map(id => schip(id, SB.get(id))).join('')}
    <button type="button" class="btn sm${m.stockUsed.length ? ' on' : ''}" data-act="meal-stock" data-k="${k}" data-i="${i}">${m.stockUsed.length ? `재고 ${m.stockUsed.length}개 뺐음 · 되돌리기` : '재고에서 1개씩 빼기'}</button></div>` : '';
  return `<article class="meal${ed ? ' editing' : ''}">
    <div class="meal-head">
      <select class="slot" id="slot-${k}-${i}" data-field="slot" data-k="${k}" data-i="${i}" aria-label="끼니 이름">${SLOT_CHOICES.map(s => `<option${s === m.slot ? ' selected' : ''}>${s}</option>`).join('')}</select>
      <div class="meal-tools">${tool('combo','조합 바꾸기')}${tool('manual','재료 편집')}${tool('fridge','남은 재료로')}<button type="button" class="btn sm quiet" data-act="meal-del" data-k="${k}" data-i="${i}">삭제</button></div>
    </div>
    <p class="meal-items">${items || '<span class="muted">재료를 골라주세요</span>'} ${side}</p>
    ${notesHTML(r)}
    <div class="meal-log">
      <div class="seg" role="group" aria-label="먹은 정도">${STATUS.map(([v, l]) => `<button type="button" class="${v}" aria-pressed="${m.status === v}" data-act="status" data-k="${k}" data-i="${i}" data-v="${v}">${l}</button>`).join('')}</div>
      <label class="amt" for="time-${k}-${i}">먹은 시간 <input type="time" id="time-${k}-${i}" data-field="time" data-k="${k}" data-i="${i}" value="${esc(m.time)}"></label>
      <label class="amt" for="amt-${k}-${i}">먹은 양 <input type="number" inputmode="numeric" min="0" max="400" step="5" id="amt-${k}-${i}" data-field="amount" data-k="${k}" data-i="${i}" value="${m.amount ?? ''}" placeholder="0"> g</label>
    </div>
    ${stockLine}
    ${ed ? editorHTML(k, i, m, st, ed) : ''}
  </article>`;
}

}
function draftPreview(dr, stId){

const draftButtons = `<div class="row"><button type="button" class="btn primary" data-act="manual-apply">이 끼니에 적용</button><button type="button" class="btn" data-act="manual-apply" data-save="1">적용하고 조합에도 저장</button><button type="button" class="btn quiet" data-act="ed-close">닫기</button></div>`;
function editorHTML(k, i, m, st, ed){
  if (ed.mode === 'combo'){
    const own = combosOf(st.id);
    const earlier = combosUpTo(st.id).filter(c => c.stage !== st.id);
    return `<div class="editor">
      <h4>${st.name} 조합에서 고르기 <span class="row"><button type="button" class="btn sm" data-act="ed" data-k="${k}" data-i="${i}" data-mode="manual">직접 고르기</button><button type="button" class="btn sm quiet" data-act="ed-close">닫기</button></span></h4>
      ${own.length ? `<div class="picks">${own.map(c => pickBtn(c, st.id, 'apply-combo', `data-id="${c.id}"`)).join('')}</div>` : `<p class="hint">${st.name} 조합이 아직 없어요. 조합 탭에서 만들거나 아래 이전 단계 조합을 써요.</p>`}
      ${earlier.length ? `<details class="more"${own.length ? '' : ' open'}><summary>이전 단계 조합 ${earlier.length}개</summary><div class="picks">${earlier.map(c => pickBtn(c, st.id, 'apply-combo', `data-id="${c.id}"`)).join('')}</div></details>` : ''}
    </div>`;
  }
  if (ed.mode === 'manual'){
    const dr = ed.draft;
    return `<div class="editor">
      <h4>재료 직접 고르기</h4>
      ${pickerHTML('manual', st.id, [
        {cats:['prot'], act:'d-prot', selected:dr.protein ? [dr.protein] : []},
        {cats:['veg','mush','grain','dairy'], act:'d-item', selected:dr.items},
        {cats:['fruit'], act:'d-side', selected:dr.side, label:'곁들이는 과일'},
      ], ed.showAll, `<button type="button" class="btn sm quiet" data-act="d-all">${ed.showAll ? '이 시기 재료만' : '다음 시기 재료도 보기'}</button>`)}
      ${draftPreview(dr, st.id)}
      ${draftButtons}
    </div>`;
  }
  // fridge
  const fx = fridgeIdeas(st.id);
  const onChips = S.fridge.filter(id => IM.has(id) && id !== 'rice');

  const avail = fx.ids.slice().sort((a,b) => (ALL_CATS.indexOf(IM.get(a).cat) - ALL_CATS.indexOf(IM.get(b).cat)) || byIng(IM.get(a), IM.get(b)));
  const actFor = id => { const c = IM.get(id).cat; return c === 'prot' ? 'd-prot' : c === 'fruit' ? 'd-side' : 'd-item'; };
  const isOn = id => dr.protein === id || dr.items.includes(id) || dr.side.includes(id);
  return `<div class="editor">

    <h4>냉장고에 남은 재료 <span class="row"><button type="button" class="btn sm${ed.more ? ' on' : ''}" data-act="fridge-more">${ed.more ? '고르기 닫기' : '+ 재료 고르기'}</button>${onChips.length ? '<button type="button" class="btn sm quiet" data-act="fridge-clear">비우기</button>' : ''}</span></h4>
    ${onChips.length ? `<div class="chips">${onChips.map(id => chip(id, true, 'fridge-toggle', IM.get(id).m > st.max)).join('')}</div>` : '<p class="hint">남은 재료를 고르면 그 재료로 만들 수 있는 조합을 찾아줘요. 목록에 없는 재료는 ‘목록에 없으면 추가’로 넣어요.</p>'}
    ${ed.more || (!onChips.length && !fx.SB.size) ? `<div class="preview">${pickerHTML('fridge', st.id, [{cats:ALL_CATS, act:'fridge-toggle', selected:[...S.fridge]}], false)}</div>` : ''}
    ${fx.count ? `
      <h4>있는 재료로 되는 조합</h4>
      ${fx.existing.length ? `<div class="picks">${fx.existing.map(x => `<button type="button" class="pick" data-act="apply-combo" data-id="${x.c.id}">${ptag(x.c.protein)}<span class="pl">${comboLine(x.c, true)}</span><span class="pm">${x.need.length ? `<span class="bdg warn">더 필요: ${x.need.map(n => esc(nm(n))).join(', ')}</span>` : '<span class="bdg good">전부 있음</span>'}${badges(analyze(x.c.protein, x.c.items, x.c.side, st.id))}</span></button>`).join('')}</div>` : '<p class="hint">남은 재료가 들어간 저장 조합이 없어요.</p>'}
      <h4>남은 재료로 새로 만든 조합${fx.protMissing ? ' <span class="bdg warn">단백질은 따로 준비</span>' : ''}</h4>
      ${fx.ideas.length ? `<div class="picks">${fx.ideas.map((x, n) => `<div class="pick-wrap"><button type="button" class="pick" data-act="apply-idea" data-idx="${n}">${ptag(x.protein)}<span class="pl">${comboLine({protein:x.protein, items:x.items, side:[]}, true)}</span><span class="pm">${badges(analyze(x.protein, x.items, [], st.id))}${x.known ? '<span class="bdg">저장된 조합</span>' : ''}</span></button>${x.known ? '' : `<button type="button" class="btn sm" data-act="save-idea" data-idx="${n}" title="조합 목록에 저장">저장</button>`}</div>`).join('')}</div>` : '<p class="hint">채소를 한두 가지 더 고르면 새 조합을 만들어요.</p>'}
      <div class="builder">
        <h4>내가 직접 조합 고르기 <span class="muted" style="font-weight:500">남은 재료·재고에서 눌러 담아요</span></h4>
        <div class="chips">${avail.map(id => chip(id, isOn(id), actFor(id), false)).join('')}</div>
        ${draftPreview(dr, st.id)}
        ${draftButtons}
      </div>
    ` : '<div class="row"><button type="button" class="btn quiet" data-act="ed-close">닫기</button></div>'}
  </div>`;
}

/* combos view */
function combosHTML(){
  const stId = S.ui.comboStage || curStage();
  const st = stageById(stId);
  const list = combosOf(stId);
  const usage = new Map();
  for (const day of S.plan.values()) for (const m of day.meals) if (m.comboId) usage.set(m.comboId, (usage.get(m.comboId)||0) + 1);
  const prevSt = STAGES[stageIdx(stId)-1];
  const prevCount = prevSt ? combosOf(prevSt.id).length : 0;
  const seg = STAGES.map(s => `<button type="button" aria-pressed="${s.id === stId}" data-act="cstage" data-v="${s.id}">${s.name} ${combosOf(s.id).length}<small>${s.range}</small></button>`).join('');
  const groups = [
    {id:'beef', name:'소고기', test:c => c.protein === 'beef', tag:'beef'},
    {id:'chicken', name:'닭고기', test:c => c.protein === 'chicken', tag:'chicken'},
    {id:'etc', name:'두부·생선·기타', test:c => c.protein !== 'beef' && c.protein !== 'chicken', tag:'tofu'},
  ];
  const row = c => {
    const r = analyze(c.protein, c.items, c.side, stId);
    const u = usage.get(c.id) || 0;
    const showProt = c.protein !== 'beef' && c.protein !== 'chicken';
    return `<li class="crow">
      <button type="button" class="tick" aria-pressed="${c.fav}" data-act="fav" data-id="${c.id}" aria-label="자주 쓰는 조합 표시">✓</button>
      <div><div class="cline">${comboLine(c, showProt)}</div><div class="cmeta">${badges(r)}${u ? `<span>식단 ${u}끼</span>` : ''}${c.memo ? `<span>${esc(c.memo)}</span>` : ''}</div></div>
      <div class="cact"><button type="button" class="btn sm quiet" data-act="combo-edit" data-id="${c.id}">수정</button><button type="button" class="btn sm quiet danger" data-act="combo-del" data-id="${c.id}">삭제</button></div>
      ${S.ui.confirmDel === c.id ? `<div class="confirm">이 조합을 지울까요? 이미 짠 식단은 그대로 남아요. <button type="button" class="btn sm danger" data-act="combo-del-yes" data-id="${c.id}">지우기</button><button type="button" class="btn sm quiet" data-act="combo-del-no">취소</button></div>` : ''}
    </li>`;
  };
  const cols = groups.map(g => {
    const items = list.filter(g.test);
    if (!items.length && g.id === 'etc') return '';
    return `<section class="card ccol"><h3>${ptag(g.tag)}${g.name}<small>${items.length}개</small></h3>
      ${items.length ? `<ol class="clist">${items.map(row).join('')}</ol>` : '<p class="hint" style="padding:10px 0">아직 없어요.</p>'}</section>`;
  }).join('');
  return `<div class="vbar">
      <div class="stage-seg" role="group" aria-label="단계">${seg}</div>
      <div class="row">
        <button type="button" class="btn primary" data-act="cf-new">+ 새 조합</button>
        <button type="button" class="btn" data-act="sug">추천 조합 만들기</button>
        ${prevSt && prevCount ? `<button type="button" class="btn" data-act="copy-prev">${prevSt.name} 조합 가져오기</button>` : ''}
      </div>
    </div>
    ${S.ui.comboForm ? comboFormHTML() : ''}

/* topping stock view */
function stockHTML(){
  const active = activeStock();
  const done = [...S.stock.values()].filter(s => s.qty <= 0).sort((a,b) => b.expires.localeCompare(a.expires));
  const soon = active.filter(s => { const d = urg(s.expires).d; return d >= 0 && d <= 3; }).length;
  const expired = active.filter(s => urg(s.expires).d < 0).length;
  const plan = plannedUses();
  const f = S.ui.stockForm;
  const showForm = f.open || !S.stock.size;
  const ramp = [14,12,10,8,6,4,2,0].map(d => { const p = Math.min(1, Math.max(0.05, 1 - d / SHELF)); return `<i style="--u:${Math.round(p*100)}%" title="D-${d}"></i>`; }).join('');
  return `<div class="stk-sum">
      <div class="stk-num"><b>${active.length}</b><span>남은 토핑</span></div>
      <div class="stk-num${soon ? ' alert' : ''}"><b>${soon}</b><span>3일 안에 기한</span></div>
      <div class="stk-num${expired ? ' alert' : ''}"><b>${expired}</b><span>기한 지남</span></div>
      <div class="ramp" aria-hidden="true"><div class="ramp-bar">${ramp}</div><div class="ramp-lab"><span>D-14</span><span>오늘</span></div></div>
      ${showForm ? '' : '<button type="button" class="btn primary" data-act="sf-open">+ 토핑 추가</button>'}
    </div>
    ${showForm ? stockFormHTML() : ''}
    ${active.length ? `<div class="stk-grid">${active.map(s => stockCard(s, plan.get(s.id) || 0)).join('')}</div>` : (S.stock.size ? '<p class="hint" style="margin-top:14px">남은 토핑이 없어요. 새로 만든 토핑을 추가해 주세요.</p>' : '')}
    <p class="hint" style="margin-top:12px">카드 색이 진할수록 소비기한이 가까워요. ‘기한 안 식단’은 오늘부터 기한까지 짜둔 식단 중 이 토핑이 들어간 끼니 수예요. 식단의 ‘재고에서 1개씩 빼기’를 누르면 여기 수량이 줄어요.</p>
    ${done.length ? `<details class="more" style="margin-top:16px"><summary>다 쓴 토핑 ${done.length}개</summary><ul class="done-list">${done.map(s => `<li>${hl(s.ing)}<span class="muted">만든 날 ${md(s.made)} · 기한 ${md(s.expires)}</span><span class="row"><button type="button" class="btn sm" data-act="stk-inc" data-id="${s.id}">+1 되살리기</button><button type="button" class="btn sm quiet danger" data-act="stk-del" data-id="${s.id}">삭제</button></span></li>`).join('')}</ul></details>` : ''}`;
}
function stockFormHTML(){
  const f = S.ui.stockForm;
  const made = isDateKey(f.made) ? f.made : TODAY;
  const exp = keyOf(addDays(parseKey(made), Number(f.days) || SHELF));

    ${pickerHTML('stock', curStage(), [{cats:ALL_CATS, act:'sf-ing', selected:f.ings}], f.showAll, `<button type="button" class="btn sm quiet" data-act="sf-all">${f.showAll ? '이 시기 재료만' : '다음 시기 재료도 보기'}</button>`)}
    <div class="frow">
      <label class="f" for="sf-made">만든 날<input type="date" id="sf-made" data-bind="stockForm.made" data-rerender="1" value="${esc(made)}"></label>
      <label class="f" for="sf-days">소비기한<select id="sf-days" data-bind="stockForm.days" data-rerender="1">${days.map(d => `<option value="${d}"${String(f.days) === String(d) ? ' selected' : ''}>${d}일${d === SHELF ? ' (2주)' : ''}</option>`).join('')}</select></label>
      <label class="f" for="sf-qty">수량<input type="number" id="sf-qty" data-bind="stockForm.qty" min="1" max="999" step="1" inputmode="numeric" value="${esc(f.qty)}"></label>
      <label class="f" for="sf-unit">단위<select id="sf-unit" data-bind="stockForm.unit">${UNITS.map(u => `<option${f.unit === u ? ' selected' : ''}>${u}</option>`).join('')}</select></label>
      <label class="f" for="sf-memo">메모<input type="text" id="sf-memo" data-bind="stockForm.memo" maxlength="40" value="${esc(f.memo)}" placeholder="예: 큐브 15g"></label>
    </div>
    <p class="hint">기한 ${md(exp)} (${dLabel(daysBetween(TODAY, exp))})${f.ings.length ? ` · ${f.ings.map(nm).join(', ')}` : ''}</p>
    <div class="row"><button type="submit" class="btn primary">${f.ings.length ? `${f.ings.length}가지 재고에 넣기` : '재고에 넣기'}</button>${S.stock.size ? '<button type="button" class="btn quiet" data-act="sf-close">닫기</button>' : ''}</div>
  </form>`;
}
function stockCard(s, uses){
  const u = urg(s.expires);
  const ed = S.ui.stockEdit && S.ui.stockEdit.id === s.id ? S.ui.stockEdit : null;
  const countable = s.unit !== 'g';
  const left = countable ? s.qty - uses : 0;
  return `<article class="stk${u.hot ? ' hot' : ''}${u.d < 0 ? ' expired' : ''}" style="--u:${Math.round(u.p*100)}%" aria-label="${esc(nm(s.ing))} ${s.qty}${esc(s.unit)}, ${dLabel(u.d)}">
    <div class="stk-top"><i class="dot" style="--d:var(--dot-${colorOf(s.ing)})"></i><b class="stk-name">${esc(nm(s.ing))}</b><span class="stk-d">${dLabel(u.d)}</span></div>
    <div class="stk-qty"><button type="button" class="qbtn" data-act="stk-dec" data-id="${s.id}" aria-label="${esc(nm(s.ing))} 1${esc(s.unit)} 썼어요">−</button><span><b>${s.qty}</b> ${esc(s.unit)}</span><button type="button" class="qbtn" data-act="stk-inc" data-id="${s.id}" aria-label="${esc(nm(s.ing))} 1${esc(s.unit)} 더하기">+</button></div>
    <p class="stk-line">만든 날 ${md(s.made)} · 기한 ${md(s.expires)}</p>

    ${countable && left > 0 && u.d >= 0 ? `<p class="stk-warn">${left}${esc(s.unit)}가 기한 안에 남을 예정이에요</p>` : ''}
    ${u.d < 0 ? '<p class="stk-warn">소비기한이 지났어요</p>' : ''}
    ${s.memo ? `<p class="stk-line">${esc(s.memo)}</p>` : ''}
    <div class="row"><button type="button" class="btn sm" data-act="stk-edit" data-id="${s.id}">수정</button><button type="button" class="btn sm" data-act="stk-del" data-id="${s.id}">삭제</button></div>
    ${ed ? `<div class="stk-edit">
      <label class="f" for="se-qty">수량<input type="number" id="se-qty" data-bind="stockEdit.qty" min="0" max="999" value="${esc(ed.qty)}"></label>
      <label class="f" for="se-unit">단위<select id="se-unit" data-bind="stockEdit.unit">${UNITS.map(x => `<option${ed.unit === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="f" for="se-made">만든 날<input type="date" id="se-made" data-bind="stockEdit.made" value="${esc(ed.made)}"></label>
      <label class="f" for="se-exp">소비기한<input type="date" id="se-exp" data-bind="stockEdit.expires" value="${esc(ed.expires)}"></label>
      <label class="f full" for="se-memo">메모<input type="text" id="se-memo" data-bind="stockEdit.memo" maxlength="40" value="${esc(ed.memo)}"></label>
      <div class="row full"><button type="button" class="btn sm primary" data-act="stk-save">저장</button><button type="button" class="btn sm quiet" data-act="stk-cancel">취소</button></div>
    </div>` : ''}
  </article>`;
}

/* ingredients view */
function ingredientsHTML(){
  const cs = stageById(curStage());

  const visible = [...IM.values()].filter(g => !g.hidden);
  const hidden = [...IM.values()].filter(g => g.hidden).sort(byIng);
  const list = visible.filter(g => (S.ui.ingCat === 'all' || g.cat === S.ui.ingCat) && (!filterSt || g.m <= filterSt.max));
  const groups = CATS.map(c => {
    const items = list.filter(g => g.cat === c.id).sort(byIng);
    if (!items.length) return '';
    return `<section><h3>${c.name} <small class="muted" style="font-family:var(--font-body);font-size:13px;font-weight:500">${items.length}</small></h3><div class="ing-grid">${items.map(g => ingCard(g, cs)).join('')}</div></section>`;
  }).join('');
  const triedN = visible.filter(g => g.tried).length;
  const ni = S.ui.ni;
  return `<div class="vbar">
      <div class="stage-seg" role="group" aria-label="분류">
        <button type="button" aria-pressed="${S.ui.ingCat === 'all'}" data-act="ing-cat" data-v="all">전체<small>${visible.length}가지</small></button>
        ${CATS.map(c => `<button type="button" aria-pressed="${S.ui.ingCat === c.id}" data-act="ing-cat" data-v="${c.id}">${c.name}<small>${visible.filter(g => g.cat === c.id).length}가지</small></button>`).join('')}
      </div>
      <label class="f" for="ing-stage" style="min-width:180px">보기
        <select id="ing-stage" data-bind="ingStage" data-rerender="1"><option value="all"${S.ui.ingStage === 'all' ? ' selected' : ''}>모든 시기 재료</option>${STAGES.map(s => `<option value="${s.id}"${S.ui.ingStage === s.id ? ' selected' : ''}>${s.name}(${s.range})까지 먹는 재료</option>`).join('')}</select></label>
    </div>
    <p class="hint" style="margin-top:10px">점선 카드는 지금 단계(${cs.name})에서는 아직 이른 재료예요. ‘먹어봄’을 하나라도 표시하면, 식단에 처음 먹는 재료가 들어간 날을 알려줘요${triedN ? ` · 지금 ${triedN}가지 먹어봄` : ''}. ‘반응 있음’ 재료는 자동 짜기와 추천에서 빠져요.</p>
    <div class="ing-groups">${groups || '<p class="hint">조건에 맞는 재료가 없어요.</p>'}</div>
    <form class="card addform" data-form="ing">
      <h3>재료 추가</h3>
      <div class="frow">
        <label class="f" for="ni-name">이름<input type="text" id="ni-name" data-bind="ni.name" maxlength="12" value="${esc(ni.name)}" placeholder="예: 케일" required></label>
        <label class="f" for="ni-cat">분류<select id="ni-cat" data-bind="ni.cat">${CATS.map(c => `<option value="${c.id}"${ni.cat === c.id ? ' selected' : ''}>${c.name}</option>`).join('')}</select></label>
        <label class="f" for="ni-m">먹기 시작하는 월령<select id="ni-m" data-bind="ni.m">${[5,6,7,8,9,10,11,12].map(m => `<option value="${m}"${String(ni.m) === String(m) ? ' selected' : ''}>${m}개월${m === 12 ? ' 이후' : ''}</option>`).join('')}</select></label>
        <label class="f" for="ni-color">색 (달력 점 색)<select id="ni-color" data-bind="ni.color">${COLORS.map(([v, l]) => `<option value="${v}"${ni.color === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
        <button type="submit" class="btn primary">추가</button>
      </div>
    </form>
    ${hidden.length ? `<section class="card addform"><h3>목록에서 뺀 재료 ${hidden.length}가지</h3><p class="hint">고르기 목록에서만 빠져 있어요. 누르면 다시 보여요.</p><div class="chips">${hidden.map(g => `<button type="button" class="chip" style="--h:var(--hl-${g.color});--d:var(--dot-${g.color})" data-act="ing-unhide" data-id="${g.id}"><i class="dot"></i>${esc(g.name)} <small>다시 보이기</small></button>`).join('')}</div></section>` : ''}
    ${pairsHTML()}`;
}

}

    return `<section class="card gcard${s.id === cur ? ' cur' : ''}">

      <ul>${s.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      ${fresh.length ? `<div class="cgroup"><span class="cglabel">이 시기에 새로 먹는 재료</span><p style="line-height:1.9">${fresh.map(g => hl(g.id)).join(' ')}</p></div>` : ''}
