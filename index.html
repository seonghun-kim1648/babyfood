  return `<div class="guide-grid">${cards}</div>
    <section class="card rules"><h3 style="font-size:16px">모든 시기 공통</h3><ol>${COMMON_RULES.map(r => `<li>${esc(r)}</li>`).join('')}</ol>
    <p class="hint">일반적인 권장 범위예요. 양과 시기는 아기 상태에 따라 달라질 수 있으니 소아과 선생님과 상의해 주세요.</p></section>`;
}

/* ───────────── events ───────────── */
function readHash(){ const h = location.hash.replace('#', ''); S.view = VIEWS.includes(h) ? h : 'calendar'; }
window.addEventListener('hashchange', () => { readHash(); S.ui.editor = null; render(); window.scrollTo(0, 0); });

function goMonthOf(k){ const d = parseKey(k); if (d.getMonth() !== S.month.getMonth() || d.getFullYear() !== S.month.getFullYear()) S.month = new Date(d.getFullYear(), d.getMonth(), 1); }
function scrollSheet(){
  if (!window.matchMedia('(max-width:1100px)').matches) return;
  const el = document.getElementById('sheet'); if (!el) return;
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:smooth ? 'smooth' : 'auto', block:'start'});
}
function applyToMeal(k, i, c){
  const day = getDay(k);
  if (!day.meals[i]) day.meals[i] = normMeal({slot:(SLOTS[2][i] || '간식')});
  Object.assign(day.meals[i], {protein:c.protein || '', items:[...c.items], side:[...(c.side || [])], comboId:c.comboId || ''});
  setDay(k, day);
}
function newCombo(stage, protein, items, side, memo){
  const sameStage = combosOf(stage);
  const c = {id:uid('c'), stage, protein, items:[...items], side:[...(side || [])], fav:false, memo:memo || '', order:(sameStage.length ? Math.max(...sameStage.map(x => x.order)) : 0) + 1, created:Date.now()};
  saveCombo(c); return c;
}
function toggleIn(list, id){ const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); }
function placeIn(dr, g){
  if (g.cat === 'prot') dr.protein = g.id;
  else if (g.cat === 'fruit'){ if (!dr.side.includes(g.id)) dr.side.push(g.id); }
  else if (!dr.items.includes(g.id)) dr.items.push(g.id);
}
function selectInCtx(ctx, id){
  const g = IM.get(id); if (!g) return;
  if (ctx === 'fridge'){ if (!S.fridge.includes(id)){ S.fridge.push(id); saveFridge(); } }
  else if (ctx === 'manual'){ if (S.ui.editor && S.ui.editor.draft) placeIn(S.ui.editor.draft, g); }
  else if (ctx === 'combo'){ if (S.ui.comboForm) placeIn(S.ui.comboForm, g); }
  else if (ctx === 'stock'){ if (!S.ui.stockForm.ings.includes(id)) S.ui.stockForm.ings.push(id); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act, k = t.dataset.k, id = t.dataset.id, v = t.dataset.v;
  const i = t.dataset.i !== undefined ? Number(t.dataset.i) : null;
  const ed = S.ui.editor;
  switch (act){
    case 'settings': S.ui.settings = !S.ui.settings; break;
    case 'month': S.month = new Date(S.month.getFullYear(), S.month.getMonth() + Number(t.dataset.d), 1); break;
    case 'today': S.month = new Date(today.getFullYear(), today.getMonth(), 1); S.sel = TODAY; S.ui.editor = null; break;
    case 'sel': S.sel = k; S.ui.editor = null; goMonthOf(k); render(); scrollSheet(); return;
    case 'day-step': S.sel = keyOf(addDays(parseKey(S.sel), Number(t.dataset.d))); S.ui.editor = null; goMonthOf(S.sel); break;
    case 'gen-toggle':
      S.ui.gen.open = !S.ui.gen.open;
      if (S.ui.gen.open){ S.ui.gen.start = S.sel; S.ui.gen.stage = isDateKey(S.settings.birthDate) ? 'auto' : curStage(); }
      break;
    case 'meal-add': {
      const day = getDay(k); const st = stageById(stageOf(k)); const n = day.meals.length;
      const slots = SLOTS[Math.min(Math.max(st.meals, n + 1), 4)];
      day.meals.push(normMeal({slot:slots[n] || '간식'}));
      setDay(k, day);
      S.ui.editor = {k, i:n, mode:t.dataset.mode || 'combo', draft:{protein:'', items:[], side:[]}, more:false, showAll:false};
      break;
    }
    case 'ed': {
      const mode = t.dataset.mode;
      if (ed && ed.k === k && ed.i === i && ed.mode === mode) S.ui.editor = null;
      else {
        const m = S.plan.get(k)?.meals[i];
        const fromMeal = mode === 'manual' && m;
        S.ui.editor = {k, i, mode, draft:{protein:fromMeal ? m.protein : '', items:fromMeal ? [...m.items] : [], side:fromMeal ? [...m.side] : []}, more:false, showAll:false};
      }
      break;
    }
    case 'ed-close': {
      if (ed){ const day = getDay(ed.k); const m = day.meals[ed.i]; if (m && !m.protein && !m.items.length && !m.side.length){ day.meals.splice(ed.i, 1); setDay(ed.k, day); } }
      S.ui.editor = null; break;
    }
    case 'apply-combo': { const c = S.combos.get(id); if (c && ed){ applyToMeal(ed.k, ed.i, {protein:c.protein, items:c.items, side:c.side, comboId:c.id}); S.ui.editor = null; } break; }
    case 'd-prot': if (ed) ed.draft.protein = ed.draft.protein === id ? '' : id; break;
    case 'd-item': if (ed) toggleIn(ed.draft.items, id); break;
    case 'd-side': if (ed) toggleIn(ed.draft.side, id); break;
    case 'd-all': if (ed) ed.showAll = !ed.showAll; break;
    case 'manual-apply': {
      if (!ed) break; const dr = ed.draft;
      if (!dr.protein && !dr.items.length){ toast('재료를 하나 이상 골라주세요'); return; }
      let comboId = '';
      if (t.dataset.save){
        const st = stageOf(ed.k);
        const exist = combosUpTo(st).find(c => ckey(c) === ckey(dr));
        comboId = exist ? exist.id : newCombo(st, dr.protein, dr.items, dr.side, '').id;
        toast(exist ? '이미 있는 조합이라 그대로 연결했어요' : `${stageById(st).name} 조합에 저장했어요`);
      }
      applyToMeal(ed.k, ed.i, {protein:dr.protein, items:dr.items, side:dr.side, comboId});
      S.ui.editor = null; break;
    }
    case 'fridge-toggle': toggleIn(S.fridge, id); saveFridge(); break;
    case 'fridge-more': if (ed) ed.more = !ed.more; break;
    case 'fridge-clear': S.fridge = []; saveFridge(); break;
    case 'apply-idea': case 'save-idea': {
      if (!ed) break; const st = stageOf(ed.k);
      const x = fridgeIdeas(st).ideas[Number(t.dataset.idx)]; if (!x) break;
      if (act === 'save-idea'){ newCombo(st, x.protein, x.items, [], '남은 재료로 만듦'); toast(`${stageById(st).name} 조합에 저장했어요`); }
      else {
        const known = combosUpTo(st).find(c => ckey(c) === ckey(x));
        applyToMeal(ed.k, ed.i, {protein:x.protein, items:x.items, side:[], comboId:known ? known.id : ''});
        S.ui.editor = null;
      }
      break;
    }
    case 'status': {
      const day = getDay(k); const m = day.meals[i]; if (!m) break;
      m.status = v;
      if (v !== 'plan' && !m.time && k === TODAY) m.time = nowTime();
      setDay(k, day); break;
    }
    case 'meal-del': {
      const day = getDay(k); const [m] = day.meals.splice(i, 1); setDay(k, day); S.ui.editor = null;
      toast(`${m.slot} 끼니를 지웠어요`, () => { const d2 = getDay(k); d2.meals.splice(Math.min(i, d2.meals.length), 0, m); setDay(k, d2); render(); });
      break;
    }
    case 'meal-stock': {
      const day = getDay(k); const m = day.meals[i]; if (!m) break;
      if (m.stockUsed.length){
        for (const sid of m.stockUsed){ const s = S.stock.get(sid); if (s) saveStock({...s, qty:s.qty + 1}); }
        m.stockUsed = []; setDay(k, day); toast('토핑 재고를 되돌렸어요');
      } else {
        const SB = stockByIng(); const used = [];
        for (const ingId of mealIds(m)){ const rows = SB.get(ingId); if (rows && rows.length){ const s = rows[0]; saveStock({...s, qty:s.qty - 1}); used.push(s.id); } }
        if (!used.length){ toast('뺄 토핑 재고가 없어요'); return; }
        m.stockUsed = used; setDay(k, day); toast(`토핑 재고에서 ${used.length}가지를 1개씩 뺐어요`);
      }
      break;
    }
    case 'undo': if (undoFn){ const f = undoFn; undoFn = null; document.getElementById('toast').hidden = true; f(); } return;

    case 'pk-manage': { const c = t.dataset.ctx; S.ui.manage[c] = !S.ui.manage[c]; break; }
    case 'pk-add': {
      const ctx = t.dataset.ctx; const a = S.ui.add[ctx]; if (!a) break;
      const inp = document.getElementById('add-name-' + ctx); if (inp) a.name = inp.value;
      const name = (a.name || '').trim();
      if (!name){ toast('새 재료 이름을 적어주세요'); return; }
      const g = [...IM.values()].find(x => x.name === name);
      let newId;
      if (g){ newId = g.id; if (g.hidden){ setHidden(g.id, false); toast(`‘${name}’ 다시 목록에 넣었어요`); } else toast(`‘${name}’ 이미 있어서 골라뒀어요`); }
      else { newId = addCustomIng(name, CAT_NAME[a.cat] ? a.cat : 'veg', Number(a.m) || 7); toast(`‘${name}’ 재료를 추가했어요`); }
      selectInCtx(ctx, newId);
      a.name = '';
      break;
    }
    case 'pk-del': {
      const g = IM.get(id); if (!g) break;
      const wasInFridge = S.fridge.includes(id);
      setHidden(id, true);
      if (wasInFridge){ S.fridge = S.fridge.filter(x => x !== id); saveFridge(); }
      toast(`‘${g.name}’ 목록에서 뺐어요`, () => { setHidden(id, false); if (wasInFridge && !S.fridge.includes(id)){ S.fridge.push(id); saveFridge(); } render(); });
      break;
    }

    case 'calmode': S.ui.calMode = v === 'list' ? 'list' : 'grid'; LS.set('calMode', S.ui.calMode); break;
    case 'open-settings': S.ui.settings = true; render(); window.scrollTo({top:0, behavior:'auto'}); return;
    case 'connect': {
      const val = (S.ui.tok || '').trim();
      if (!val){ toast('GitHub 토큰을 붙여넣어 주세요'); return; }
      token = val; LS.set('token', val); etag = null; S.ui.tok = '';
      render();
      pull(true).then(ok => {
        if (ok){ toast('연결했어요. 이 기기에서도 같은 기록이 보여요'); S.ui.settings = false; }
        else if (SYNC.state === 'auth') toast('토큰이 맞지 않아요. 다시 복사해 주세요');
        else if (SYNC.state === 'notfound') toast(`이 토큰으로는 ${GH.repo} 저장소를 열 수 없어요`);
        render();
      });
      return;
    }
    case 'qr': S.ui.qr = !S.ui.qr; break;
    case 'copy-link': {
      const url = connectUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('연결 링크를 복사했어요. 폰으로 보내 열면 연결돼요'), () => toast('복사하지 못했어요'));
      else toast('이 브라우저에서는 복사할 수 없어요');
      return;
    }
    case 'sync-now': if (hasPending()) save(); else pull(true); return;
    case 'backup': {
      const blob = new Blob([JSON.stringify(DOC, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `이유식-백업-${TODAY}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return;
    }
    case 'unlink': S.ui.confirmUnlink = true; break;
    case 'unlink-no': S.ui.confirmUnlink = false; break;
    case 'unlink-yes': {
      token = ''; sha = null; etag = null; DOC = emptyDoc(); PENDING = {};
      ['token','sha','doc','pending','last'].forEach(x => LS.del(x));
      docToState(); S.ui.confirmUnlink = false; S.ui.qr = false; setSync('nolink');
      toast('이 기기 연결을 끊었어요');
      break;
    }

    case 'cstage': S.ui.comboStage = v; S.ui.comboForm = null; S.ui.sug = null; S.ui.confirmDel = null; break;
    case 'cf-new': {
      const st = S.ui.comboStage || curStage();
      S.ui.comboForm = {id:null, stage:st, protein:'beef', items:[], side:[], memo:'', showAll:false};
      break;
    }
    case 'combo-edit': { const c = S.combos.get(id); if (c){ S.ui.comboForm = {id:c.id, stage:c.stage, protein:c.protein, items:[...c.items], side:[...c.side], memo:c.memo, showAll:false}; render(); window.scrollTo({top:0, behavior:'auto'}); } return; }
    case 'cf-prot': if (S.ui.comboForm) S.ui.comboForm.protein = S.ui.comboForm.protein === id ? '' : id; break;
    case 'cf-item': if (S.ui.comboForm) toggleIn(S.ui.comboForm.items, id); break;
    case 'cf-side': if (S.ui.comboForm) toggleIn(S.ui.comboForm.side, id); break;
    case 'cf-all': if (S.ui.comboForm) S.ui.comboForm.showAll = !S.ui.comboForm.showAll; break;
    case 'cf-cancel': S.ui.comboForm = null; break;
    case 'fav': { const c = S.combos.get(id); if (c) saveCombo({...c, fav:!c.fav}); break; }
    case 'combo-del': S.ui.confirmDel = id; break;
    case 'combo-del-no': S.ui.confirmDel = null; break;
    case 'combo-del-yes': { const c = delCombo(id); S.ui.confirmDel = null; if (c) toast('조합을 지웠어요', () => { saveCombo(c); render(); }); break; }
    case 'sug': { const st = S.ui.comboStage || curStage(); const seed = (S.ui.sug ? S.ui.sug.seed : 0) + 1; S.ui.sug = {stage:st, seed, list:stageIdeas(st, seed), added:[]}; break; }
    case 'sug-close': S.ui.sug = null; break;
    case 'sug-add': {
      const s = S.ui.sug; const n = Number(t.dataset.idx); const c = s && s.list[n];
      if (c && !s.added.includes(n)){ newCombo(s.stage, c.protein, c.items, [], '추천'); s.added.push(n); }
      break;
    }
    case 'copy-prev': {
      const st = S.ui.comboStage || curStage(); const prevSt = STAGES[stageIdx(st) - 1]; if (!prevSt) break;
      const have = new Set(combosOf(st).map(ckey)); let n = 0;
      for (const c of combosOf(prevSt.id)){ if (have.has(ckey(c))) continue; newCombo(st, c.protein, c.items, c.side, c.memo ? c.memo : `${prevSt.name}에서 가져옴`); n++; }
      toast(n ? `${prevSt.name} 조합 ${n}개를 가져왔어요` : '이미 모두 들어 있어요');
      break;
    }

    case 'sf-open': S.ui.stockForm.open = true; break;
    case 'sf-close': S.ui.stockForm.open = false; break;
    case 'sf-all': S.ui.stockForm.showAll = !S.ui.stockForm.showAll; break;
    case 'sf-ing': toggleIn(S.ui.stockForm.ings, id); break;
    case 'stk-dec': case 'stk-inc': {
      const s = S.stock.get(id); if (!s) break;
      const q = Math.max(0, s.qty + (act === 'stk-inc' ? 1 : -1));
      if (q === s.qty) break;
      saveStock({...s, qty:q});
      if (q === 0) toast(`${nm(s.ing)} 토핑을 다 썼어요`, () => { const cur = S.stock.get(id); if (cur) saveStock({...cur, qty:cur.qty + 1}); render(); });
      break;
    }
    case 'stk-edit': { const s = S.stock.get(id); if (s) S.ui.stockEdit = {id:s.id, qty:String(s.qty), unit:s.unit, made:s.made, expires:s.expires, memo:s.memo}; break; }
    case 'stk-cancel': S.ui.stockEdit = null; break;
    case 'stk-save': {
      const e2 = S.ui.stockEdit; const s = e2 && S.stock.get(e2.id); if (!s) break;
      const qty = Math.max(0, Math.min(999, Math.round(Number(e2.qty))));
      if (!Number.isFinite(qty)){ toast('수량을 숫자로 적어주세요'); return; }
      const made = isDateKey(e2.made) ? e2.made : s.made;
      const expires = isDateKey(e2.expires) ? e2.expires : s.expires;
      if (expires < made){ toast('소비기한이 만든 날보다 빨라요'); return; }
      saveStock({...s, qty, unit:UNITS.includes(e2.unit) ? e2.unit : s.unit, made, expires, memo:(e2.memo || '').trim()});
      S.ui.stockEdit = null; toast('토핑 재고를 고쳤어요'); break;
    }
    case 'stk-del': {
      const s = delStock(id); if (S.ui.stockEdit && S.ui.stockEdit.id === id) S.ui.stockEdit = null;
      if (s) toast(`${nm(s.ing)} 토핑을 지웠어요`, () => { saveStock(s); render(); });
      break;
    }

    case 'ing-cat': S.ui.ingCat = v; break;
    case 'ing-unhide': setHidden(id, false); break;
    case 'ing-tried': case 'ing-allergy': {
      const g = IM.get(id); if (!g) break;
      const o = ingOverride(id);
      if (act === 'ing-tried') o.tried = !g.tried; else o.allergy = !g.allergy;
      S.ingUser.set(id, o); saveIngUser(id); break;
    }
    case 'ing-del': {
      const o = S.ingUser.get(id); if (!o) break;
      S.ingUser.delete(id); dbDel('ingredients/' + id); refreshIng();
      toast(`${o.name} 재료를 지웠어요`, () => { S.ingUser.set(id, o); dbSet('ingredients/' + id, o); refreshIng(); render(); });
      break;
    }
    case 'pair-del': {
      const p = S.pairUser.get(id); if (!p) break;
      S.pairUser.delete(id); dbDel('pairs/' + id);
      toast('궁합을 지웠어요', () => { S.pairUser.set(id, p); const {id:_, ...body} = p; dbSet('pairs/' + id, body); render(); });
      break;
    }
    default: return;
  }
  render();
});

function setBind(path, value){
  const parts = path.split('.');
  let o = S.ui;
  for (let n = 0; n < parts.length - 1; n++){ if (o[parts[n]] == null) return; o = o[parts[n]]; }
  o[parts[parts.length - 1]] = value;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind && (t.type === 'text' || t.type === 'password' || t.type === 'number')) setBind(t.dataset.bind, t.value);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter){
    e.preventDefault();
    const btn = document.querySelector(`[data-act="pk-add"][data-ctx="${t.dataset.enter}"]`);
    if (btn) btn.click();
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.bind){
    setBind(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
    if (t.dataset.rerender) render();
    return;
  }
  const f = t.dataset.field; if (!f) return;
  const k = t.dataset.k, i = t.dataset.i !== undefined ? Number(t.dataset.i) : null;
  if (f === 'memo'){ const day = getDay(k); if (day.memo !== t.value){ day.memo = t.value; setDay(k, day); } }
  else if (f === 'slot'){ const day = getDay(k); if (day.meals[i]){ day.meals[i].slot = t.value; setDay(k, day); } }
  else if (f === 'time'){ const day = getDay(k); if (day.meals[i]){ const v = isTime(t.value) ? t.value : ''; if (day.meals[i].time !== v){ day.meals[i].time = v; setDay(k, day); } } }
  else if (f === 'amount'){ const day = getDay(k); if (day.meals[i]){ const n = t.value === '' ? null : Math.max(0, Math.min(1000, Math.round(Number(t.value)))); const val = Number.isFinite(n) ? n : null; if (day.meals[i].amount !== val){ day.meals[i].amount = val; setDay(k, day); } } }
  else if (f === 'set-name'){ S.settings.babyName = t.value.trim().slice(0, 20); saveSettings(); }
  else if (f === 'set-sex'){ S.settings.sex = ['boy','girl'].includes(t.value) ? t.value : ''; saveSettings(); }
  else if (f === 'set-birth'){ S.settings.birthDate = isDateKey(t.value) ? t.value : ''; saveSettings(); }
  else if (f === 'set-stage'){ S.settings.stage = t.value; S.ui.comboStage = null; saveSettings(); }
  scheduleRender();
});
document.addEventListener('submit', e => {
  const form = e.target; const kind = form.dataset && form.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === 'gen') runGenerate();
  else if (kind === 'combo'){
    const f = S.ui.comboForm; if (!f) return;
    if (!f.protein && !f.items.length){ toast('재료를 하나 이상 골라주세요'); return; }
    const memoEl = document.getElementById('cf-memo'); if (memoEl) f.memo = memoEl.value.trim();
    if (f.id){ const c = S.combos.get(f.id); if (c) saveCombo({...c, protein:f.protein, items:[...f.items], side:[...f.side], memo:f.memo}); toast('조합을 고쳤어요'); }
    else {
      const dup = combosOf(f.stage).find(c => ckey(c) === ckey(f));
      if (dup){ toast('같은 조합이 이미 있어요'); return; }
      newCombo(f.stage, f.protein, f.items, f.side, f.memo); toast(`${stageById(f.stage).name} 조합을 추가했어요`);
    }
    S.ui.comboForm = null;
  }
  else if (kind === 'stock'){
    const f = S.ui.stockForm;
    if (!f.ings.length){ toast('토핑 재료를 하나 이상 골라주세요'); return; }
    const qty = Math.round(Number(f.qty));
    if (!Number.isFinite(qty) || qty < 1){ toast('수량을 1 이상으로 적어주세요'); return; }
    const made = isDateKey(f.made) ? f.made : TODAY;
    const expires = keyOf(addDays(parseKey(made), Number(f.days) || SHELF));
    const now = Date.now();
    f.ings.forEach((ing, n) => { const id = uid('s'); saveStock({id, ing, made, expires, qty:Math.min(999, qty), unit:UNITS.includes(f.unit) ? f.unit : '큐브', memo:(f.memo || '').trim(), created:now + n}); });
    toast(`${f.ings.length}가지 토핑을 재고에 넣었어요`);
    S.ui.stockForm = {...f, ings:[], memo:'', open:false};
  }
  else if (kind === 'ing'){
    const ni = S.ui.ni; const name = (ni.name || '').trim();
    if (!name){ toast('재료 이름을 적어주세요'); return; }
    const g = [...IM.values()].find(x => x.name === name);
    if (g){ if (g.hidden){ setHidden(g.id, false); toast(`‘${name}’ 다시 목록에 넣었어요`); } else toast('같은 이름의 재료가 이미 있어요'); render(); return; }
    addCustomIng(name, ni.cat, Number(ni.m) || 7, ni.color);
    S.ui.ni = {name:'', cat:ni.cat, m:ni.m, color:ni.color};
    toast(`‘${name}’ 재료를 추가했어요`);
  }
  else if (kind === 'pair'){
    const np = S.ui.np;
    if (!np.a || !np.b || np.a === np.b){ toast('서로 다른 재료 두 가지를 골라주세요'); return; }
    if (pairList().some(p => (p.a === np.a && p.b === np.b) || (p.a === np.b && p.b === np.a))){ toast('이미 있는 궁합이에요'); return; }
    const id = uid('p'); const body = {a:np.a, b:np.b, kind:np.kind, reason:(np.reason || '').trim()};
    S.pairUser.set(id, {id, ...body}); dbSet('pairs/' + id, body);
    S.ui.np = {...np, reason:''};
    toast('궁합을 추가했어요');
  }
  render();
});

boot();
})();
</script>
</body>
</html>
